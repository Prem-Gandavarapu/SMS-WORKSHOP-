{% extends "base_public.html" %}

{% block title %}Access Denied - Student Management System{% endblock %}

{% block content %}
<div class="card shadow-sm p-4 p-md-5 bg-white text-center">
    <h1 class="display-5 fw-bold text-danger mb-2">403</h1>
    <h5 class="fw-semibold mb-3">Access Denied</h5>
    <p class="text-muted mb-4">
        {{ detail or "You do not have permission to view this page." }}
    </p>
    <div class="d-flex justify-content-center gap-2">
        <a href="/login" class="btn btn-primary">Go to Login</a>
        <a href="/logout" class="btn btn-outline-secondary">Logout</a>
    </div>
</div>
{% endblock %}
