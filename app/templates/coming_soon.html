{% extends "base.html" %}

{% block content %}
<div class="card coming-soon-card bg-white p-4 p-md-5 text-center">
    <div class="mb-3">
        <span class="coming-soon-icon">
            <!-- Construction / tools icon -->
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
            </svg>
        </span>
    </div>
    <div class="mb-3"><span class="coming-soon-status">Under progress</span></div>
    <h4 class="fw-bold mb-2">{{ feature.label }} is on its way</h4>
    <p class="text-muted mb-1">{{ feature.description }}</p>
    <p class="text-muted small mb-4">We're still building this feature. It will be available here soon.</p>
    <div>
        <a href="{{ dashboard_url }}" class="btn btn-navy">&larr; Back to Dashboard</a>
    </div>
</div>
{% endblock %}
