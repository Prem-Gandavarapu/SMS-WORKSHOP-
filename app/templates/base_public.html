<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Student Management System{% endblock %}</title>
    <!-- Bootstrap 5 CSS from CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <!-- Custom application styles -->
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="bg-light">
    <!-- Centered container for public pages like Login and Registration -->
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
        <div class="w-100 {% block wrapper_class %}public-wrapper{% endblock %}">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Bootstrap 5 JS from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
